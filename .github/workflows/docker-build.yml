name: Docker Build and Push

on:
  push:

env:
  DOCKER_HUB_USERNAME: thebesttv

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Only push to registry when branch name starts with "tbt-"
          push: ${{ startsWith(github.ref, 'refs/heads/tbt-') }}
          tags: |
            ${{ env.DOCKER_HUB_USERNAME }}/llvm-asan-instr:latest
            ${{ env.DOCKER_HUB_USERNAME }}/llvm-asan-instr:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/llvm-asan-instr:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/llvm-asan-instr:buildcache,mode=max
